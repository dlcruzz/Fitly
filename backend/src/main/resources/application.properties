# ==============================
# Configurações do Servidor
# ==============================
server.port=${PORT:10000}
spring.application.name=fitly-api

# ==============================
# Banco de Dados
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET:fitly-secret-key-2024-deve-ter-pelo-menos-32-caracteres-ok}
jwt.expiracao-ms=86400000
jwt.refresh-expiracao-ms=604800000

# ==============================
# Logs
# ==============================
logging.level.org.springframework.security=WARN
logging.level.com.fitly=INFO
