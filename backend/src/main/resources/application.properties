# ==============================
# Configurações do Servidor
# ==============================
server.port=${PORT:10000}
spring.application.name=fitly-api

# ==============================
# Banco de Dados
# ==============================
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=RM564828
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET:fitly-secret-key-2024-deve-ter-pelo-menos-32-caracteres-ok}
jwt.expiracao-ms=86400000
jwt.refresh-expiracao-ms=604800000

# ==============================
# Logs
# ==============================
logging.level.org.springframework.security=WARN
logging.level.com.fitly=INFO
