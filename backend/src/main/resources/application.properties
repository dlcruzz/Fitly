# ==============================
# Configurações do Servidor
# ==============================
server.port=8080
spring.application.name=fitly-api

# ==============================
# Banco de Dados Oracle
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/fitly_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==============================
# JWT
# ==============================
jwt.secret=fitly-secret-key-2024-deve-ter-pelo-menos-32-caracteres-ok
jwt.expiracao-ms=86400000
jwt.refresh-expiracao-ms=604800000

# ==============================
# Logs
# ==============================
logging.level.org.springframework.security=DEBUG
logging.level.com.fitly=DEBUG
