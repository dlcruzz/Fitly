spring.application.name=FitlyApi

# Porta 10000 porque o frontend (frontend/src/services/api.js) espera a API aqui por padrao
server.port=10000

spring.datasource.url=jdbc:postgresql://localhost:5432/fitly_db
spring.datasource.username=fitly_user
spring.datasource.password=fitly123

# Hibernate cria/atualiza as tabelas automaticamente a partir das entidades Java (bom para aprender; em producao usa-se migrations)
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate esta gerando de verdade
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
